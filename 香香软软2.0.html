  <!-- 自动生成图标与Manifest -->
  <script>
    function generateIcon(size, emoji) {
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2-4, 0, Math.PI*2);
      ctx.fillStyle = '#f8bbd0'; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `${size*0.5}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(emoji || '🧸', size/2, size/2);
      return canvas.toDataURL('image/png');
    }
    const icon192 = generateIcon(192, '🧸');
    const icon512 = generateIcon(512, '💕');
    
    // 添加apple-touch-icon
    const appleIconLink = document.createElement('link');
    appleIconLink.rel = 'apple-touch-icon'; appleIconLink.href = icon192;
    document.head.appendChild(appleIconLink);
    
    // 内联manifest
    const manifest = {
      name: '香香软软聊天',
      short_name: '香香软软',
      start_url: '.',
      display: 'standalone',
      background_color: '#fce4ec',
      theme_color: '#f8bbd0',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png' },
        { src: icon512, sizes: '512x512', type: 'image/png' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest'; manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);
    
    // 注册 Service Worker (离线缓存)
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'sweet-v2';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
          self.skipWaiting();
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(()=>{});
    }
  </script>

    async function callAI(userMessage) {
      if(!apiConfig.key) return '宝～你还没设置 API Key 呢 🥺 刷新页面重新设置一下～';
      const persona = PERSONAS[currentPersona];
      const levelName = AFFECTION_TITLES[affectionLevel];
      
      const systemPrompt = `${persona.prompt}
    当前你对用户的好感度为 ${affection}，关系阶段为【${levelName}】。
    请根据好感度阶段调整你的语气和亲密度：
    - 陌生人阶段(0-20)：礼貌、试探、保持距离
    - 熟人阶段(21-50)：放松、友好、开始展露个性
    - 朋友阶段(51-80)：在意对方、会害羞、偶尔小别扭
    - 密友阶段(81-100)：坦诚、深刻、会主动关心
    你的回复需要有真实的情感层次，不能敷衍。你要表达出你这个人格的特色情感。
    你是 Galgame 中的角色，偶尔可以在对话中抛出三选一选项卡片（但不是每次都要）。
    抛出选项的格式为：【三选一】选项A|选项B|选项C
    三选一是自然地嵌入对话中的，选项描述要有画面感和情绪，不能干巴巴。`;
      
      try {
        const model = apiConfig.provider==='deepseek' ? 'deepseek-chat' : 'gpt-3.5-turbo';
        const response = await fetch(`${apiConfig.base}/chat/completions`, {
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiConfig.key}`},
          body:JSON.stringify({
            model, messages:[
              {role:'system', content:systemPrompt},
              {role:'user', content:userMessage}
            ], temperature:0.9, max_tokens:500
          })
        });
        if(!response.ok) {
          const err = await response.json().catch(()=>({}));
          throw new Error(err.error?.message || `请求失败 (${response.status})`);
        }
        const data = await response.json();
        return data.choices[0].message.content;
      } catch(err) {
        return `呜呜～网络好像出了点小问题 🥺\n${err.message}\n宝～检查一下 API Key 和网络好不好呀～`;
      }
    }

      row.innerHTML = `
        <div class="avatar ${avatarClass}">${avatarEmoji}</div>
        <div class="bubble ${bubbleClass}">${text.replace(/\n/g,'<br>')}</div>`;
      container.insertBefore(row, typing);
      container.scrollTop = container.scrollHeight;
      if(save) {
        chatHistory.push({text, isSelf});
        saveAllData();
      }
    }
    
    async function sendMessage(text) {
      if(!text) text = document.getElementById('messageInput').value.trim();
      if(!text) return;
      document.getElementById('messageInput').value = '';
      document.getElementById('sendBtn').disabled = true;
      
      addMessageToDOM(text, true);
      
      // 检查是否是抱抱消息
      if(text.startsWith('🫂')) {
        affection += 5;
        updateAffection();
        addMessageToDOM(`收到你的抱抱啦～（好感+5）${PERSONAS[currentPersona].emoji} ${getHugResponse()}`, false);
        document.getElementById('sendBtn').disabled = false;
        return;
      }
      
      // 显示打字中
      document.getElementById('typingIndicator').style.display = 'flex';
      document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
      
      const reply = await callAI(text);
      
      document.getElementById('typingIndicator').style.display = 'none';
      
      // 检查是否包含三选一
      if(reply.includes('【三选一】')) {
        const parts = reply.split('【三选一】');
        const mainText = parts[0].trim();
        const choices = parts[1].split('|').map(s=>s.trim());
        if(mainText) addMessageToDOM(mainText, false);
        showChoiceCard(choices);
      } else {
        addMessageToDOM(reply, false);
      }
      
      // 随机增加好感
      affection += Math.floor(Math.random()*3)+1;
      updateAffection();
      document.getElementById('sendBtn').disabled = false;
    }
    
    function getHugResponse() {
      const responses = [
        '被你的抱抱暖到了～蹭蹭～💕',
        '唔…抱这么紧，我都不好意思了啦 ( ˶\'ᵕ\'˶)',
        '嘿嘿～你的抱抱是今天最棒的礼物 🎀',
        '抱抱能量补充完毕！元气满满～✨',
        '啊呀～你的抱抱让我心跳加速了啦 🥺'
      ];
      return responses[Math.floor(Math.random()*responses.length)];
    }
    
    function showChoiceCard(choices) {
      const container = document.getElementById('choiceContainer');
      container.innerHTML = `
        <div class="choice-card">
          <div class="choice-title">🎯 【命运的选择出现了！】</div>
          <button class="choice-btn" onclick="selectChoice('A')">🅰️ ${choices[0]}</button>
          <button class="choice-btn" onclick="selectChoice('B')">🅱️ ${choices[1]}</button>
          <button class="choice-btn" onclick="selectChoice('C')">🅲️ ${choices[2]}</button>
        </div>`;
    }
    
    function selectChoice(choice) {
      document.getElementById('choiceContainer').innerHTML = '';
      const responses = {
        'A': '你选择了温柔贴贴的选项呢～（好感+8）',
        'B': '元气搞怪！这个选择真有趣～（好感+5）',
        'C': '傲娇冷淡风…但我知道你心里不是这么想的～（好感+3）'
      };
      const bonus = choice==='A'?8 : choice==='B'?5 : 3;
      affection += bonus;
      updateAffection();
      addMessageToDOM(responses[choice], false);
      
      // 检查是否触发特殊事件
      checkSpecialEvent();
    }
    
    function checkSpecialEvent() {
      if(affection >= 50 && affectionLevel < 2) {
        setTimeout(()=>{
          addMessageToDOM(`🌟 *【特殊事件触发】*\n${PERSONAS[currentPersona].name}对你的态度似乎有了微妙的变化…`, false);
        }, 1500);
      }
      if(affection >= 80 && affectionLevel < 3) {
        setTimeout(()=>{
          addMessageToDOM(`💫 *【特殊事件触发】*\n${PERSONAS[currentPersona].name}的脸红了起来，说话开始变得吞吞吐吐…`, false);
        }, 1500);
      }
    }
    
    function updateAffection() {
      affection = Math.min(100, Math.max(0, affection));
      for(let i=AFFECTION_THRESHOLDS.length-1; i>=0; i--) {
        if(affection >= AFFECTION_THRESHOLDS[i]) {
          affectionLevel = i; break;
        }
      }
      updatePersonaBar();
      saveAllData();
    }
    
    function updatePersonaBar() {
      document.getElementById('personaName').textContent = currentPersona + ' ' + PERSONAS[currentPersona].name;
      document.getElementById('affectionNum').textContent = affection;
      document.getElementById('affectionFill').style.width = affection + '%';
      document.getElementById('relationTitle').textContent = AFFECTION_TITLES[affectionLevel];
    }
    
    // ========== 复制消息 ==========
    function setupCopyHandler() {
      document.getElementById('chatMessages').addEventListener('click', function(e) {
        const bubble = e.target.closest('.bubble');
        if(!bubble) return;
        const text = bubble.innerText;
        navigator.clipboard.writeText(text).then(()=>{
          const toast = document.createElement('div');
          toast.className = 'copy-toast';
          toast.textContent = '📋 已复制～';
          document.body.appendChild(toast);
          setTimeout(()=>toast.remove(), 1500);
        }).catch(()=>{});
      });
    }
    
    // ========== 抱抱面板 ==========
    function openHugPanel() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.onclick = function(e) { if(e.target===overlay) overlay.remove(); };
      let html = '<div class="modal"><h3>🫂 选一个抱抱吧～</h3><div class="hug-panel">';
      HUGS.forEach((hug, i) => {
        html += `<button class="hug-item" onclick="sendHug(${i})">${hug}</button>`;
      });
      html += '</div><button onclick="this.closest(\'.modal-overlay\').remove()">✖️ 关闭</button></div>';
      overlay.innerHTML = html;
      document.body.appendChild(overlay);
    }
    
    function sendHug(index) {
      document.querySelector('.modal-overlay')?.remove();
      sendMessage('🫂 ' + HUGS[index]);
    }
    
    // ========== 皮肤面板 ==========
    function openSkinPanel() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.onclick = function(e) { if(e.target===overlay) overlay.remove(); };
      let html = '<div class="modal"><h3>🎨 切换皮肤</h3><div class="skin-panel">';
      SKINS.forEach(skin => {
        const active = document.body.className === skin.id ? ' active' : '';
        html += `<div class="skin-item${active}" style="background:${skin.color};" onclick="applySkin('${skin.id}')">${skin.name}</div>`;
      });
      html += '</div><button onclick="this.closest(\'.modal-overlay\').remove()">✖️ 关闭</button></div>';
      overlay.innerHTML = html;
      document.body.appendChild(overlay);
    }
    
    function applySkin(skinId) {
      document.body.className = skinId;
      document.querySelector('.modal-overlay')?.remove();
      saveAllData();
    }
    
    // ========== 人格面板 ==========
    function openPersonaPanel() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.onclick = function(e) { if(e.target===overlay) overlay.remove(); };
      let html = '<div class="modal"><h3>🎭 切换人格</h3><div style="max-height:50vh;overflow-y:auto;">';
      Object.entries(PERSONAS).forEach(([id, p]) => {
        const active = currentPersona === id ? ' style="background:#fce4ec;"' : '';
        html += `<button${active} onclick="switchPersona('${id}')" style="width:100%;padding:10px;margin:4px 0;border:none;border-radius:12px;text-align:left;cursor:pointer;font-size:14px;">${p.emoji} ${id} · ${p.name}</button>`;
      });
      html += '</div><button onclick="this.closest(\'.modal-overlay\').remove()">✖️ 关闭</button></div>';
      overlay.innerHTML = html;
      document.body.appendChild(overlay);
    }
    
    function switchPersona(id) {
      currentPersona = id;
      affection = Math.floor(Math.random()*10);
      affectionLevel = 0;
      updatePersonaBar();
      document.querySelector('.modal-overlay')?.remove();
      addMessageToDOM(`✨ 人格已切换为：${PERSONAS[id].emoji} ${PERSONAS[id].name}\n（好感度已重置，开始新的故事吧～）`, false);
      saveAllData();
    }
    
    // ========== 音乐 ==========
    function updateMusicSelect() {
      const select = document.getElementById('musicSelect');
      select.innerHTML = '';
      SONGS.forEach((song, i) => {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = song.name;
        if(i===currentTrack) opt.selected = true;
        select.appendChild(opt);
      });
    }
    
    function openMusicPanel() {
      document.getElementById('musicBar').style.display = 'flex';
      updateMusicSelect();
    }
    
    function closeMusicBar() {
      document.getElementById('musicBar').style.display = 'none';
      document.getElementById('bgmAudio').pause();
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶️';
    }
    
    function changeTrack() {
      currentTrack = parseInt(document.getElementById('musicSelect').value);
      const audio = document.getElementById('bgmAudio');
      audio.src = SONGS[currentTrack].url;
      audio.volume = document.getElementById('volumeSlider').value / 100;
      if(isPlaying) audio.play();
      saveAllData();
    }
    
    function togglePlay() {
      const audio = document.getElementById('bgmAudio');
      if(!audio.src || audio.src === window.location.href) {
        audio.src = SONGS[currentTrack].url;
      }
      if(isPlaying) {
        audio.pause();
        document.getElementById('playBtn').textContent = '▶️';
      } else {
        audio.play().catch(()=>alert('宝～浏览器需要你点一下才能播音乐喔～'));
        document.getElementById('playBtn').textContent = '⏸️';
      }
      isPlaying = !isPlaying;
    }
    
    function changeVolume() {
      document.getElementById('bgmAudio').volume = document.getElementById('volumeSlider').value / 100;
    }
    
    // ========== 早安晚安 ==========
    function openAlarmPanel() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.onclick = function(e) { if(e.target===overlay) overlay.remove(); };
      overlay.innerHTML = `
        <div class="modal">
          <h3>⏰ 早安晚安设置</h3>
          <label>☀️ 早安</label>
          <input type="time" id="morningTime" value="${alarmConfig.morning.time}">
          <textarea id="morningText" rows="3">${alarmConfig.morning.text}</textarea>
          <label>🌙 晚安</label>
          <input type="time" id="nightTime" value="${alarmConfig.night.time}">
          <textarea id="nightText" rows="3">${alarmConfig.night.text}</textarea>
          <button onclick="saveAlarm()">💾 保存设置</button>
          <button onclick="this.closest('.modal-overlay').remove()">✖️ 关闭</button>
        </div>`;
      document.body.appendChild(overlay);
    }
    
    function saveAlarm() {
      alarmConfig.morning.time = document.getElementById('morningTime').value;
      alarmConfig.morning.text = document.getElementById('morningText').value;
      alarmConfig.night.time = document.getElementById('nightTime').value;
      alarmConfig.night.text = document.getElementById('nightText').value;
      document.querySelector('.modal-overlay')?.remove();
      saveAllData();
      addMessageToDOM('✅ 早安晚安设置已保存～', false);
    }
    
    function checkAlarms() {
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      const lastCheck = localStorage.getItem('lastAlarmCheck') || '';
      if(timeStr === lastCheck) return;
      localStorage.setItem('lastAlarmCheck', timeStr);
      
      if(alarmConfig.morning.enabled && timeStr === alarmConfig.morning.time) {
        addMessageToDOM(alarmConfig.morning.text, false);
      }
      if(alarmConfig.night.enabled && timeStr === alarmConfig.night.time) {
        addMessageToDOM(alarmConfig.night.text, false);
      }
    }
    
    // ========== 导出 & 清空 ==========
    function exportChat() {
      let text = '香香软软聊天记录 💕\n\n';
      chatHistory.forEach(msg => {
        text += (msg.isSelf ? '🩰 我：' : '🧸 AI：') + msg.text + '\n\n';
      });
      const blob = new Blob([text], {type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '香香软软聊天记录.txt';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function clearChat() {
      if(confirm('宝～确定要清空所有聊天记录吗？🥺')) {
        chatHistory = [];
        document.getElementById('chatMessages').innerHTML = `
          <div class="message-row">
            <div class="avatar avatar-other">🧸</div>
            <div><div class="bubble bubble-other">聊天记录已清空～我们重新开始吧 ✨</div></div>
          </div>
          <div class="message-row" id="typingIndicator" style="display:none;">
            <div class="avatar avatar-other">🧸</div>
            <div class="bubble bubble-other"><span class="typing-dots">⋯</span></div>
          </div>`;
        saveAllData();
      }
    }
    
    // ========== 事件监听 ==========
    document.getElementById('sendBtn').addEventListener('click', ()=>sendMessage());
    document.getElementById('messageInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter') sendMessage();
    });
    
    // 初始化
    init();
  </script>
</body>
</html>
